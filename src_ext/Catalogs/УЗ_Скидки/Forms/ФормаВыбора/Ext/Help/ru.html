<h1>Скидки</h1>
<p>Выбор скидки. Выберите скидку двойным щелчком.</p>
<ul>
<li>Колонки: «Код», «Наименование», «Сумма», «Процент %», «Комментарий».</li>
<li>«Создать» — новая скидка, «Создать группу» — новая группа, «Скопировать» — копия выбранной скидки.</li>
</ul>
<p>Подробнее: <a href="Catalog.УЗ_Скидки/Help">Скидки</a></p>
