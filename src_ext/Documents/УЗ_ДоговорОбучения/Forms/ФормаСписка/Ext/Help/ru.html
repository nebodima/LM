<h1>Договоры обучения</h1>
<p>Договоры с заказчиками: номер и дата, обучающийся, заказчик, предмет и стоимость.</p>
<p>Кнопка «Создать» открывает новый договор, «Скопировать» — копию выделенного (например, на новый учебный год).</p>
<p>Подробнее: <a href="Document.УЗ_ДоговорОбучения/Help">Договоры обучения</a></p>
