<h1>Переводы учеников</h1>
<p>Список переводов: зачисления в группы, переводы из группы в группу и выбытия. В колонках — дата, с которой действует перевод, «Из группы», «В группу» и причина.</p>
<p>Кнопка «Создать» открывает новый перевод, «Скопировать» — копию выделенного.</p>
<p>Подробнее: <a href="Document.УЗ_ПереводУченика/Help">Переводы учеников</a></p>
