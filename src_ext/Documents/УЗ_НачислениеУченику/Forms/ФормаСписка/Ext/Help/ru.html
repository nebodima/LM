<h1>Начисления ученикам</h1>
<p>Список начислений ученикам: наборы, материалы, взносы. В колонках — ученик, предмет, статья и сумма.</p>
<p>Кнопка «Создать» открывает новое начисление, «Скопировать» — копию выделенного.</p>
<p>Подробнее: <a href="Document.УЗ_НачислениеУченику/Help">Начисления ученикам</a></p>
