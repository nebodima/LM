<h1>Общий журнал (все документы)</h1>
<p>Все документы раздела «Учёт занятий» по дате: уроки, деньги, начисления, зарплата. В колонках — дата, номер, вид документа, физ. лицо, сумма и комментарий; организацию и автора можно показать через меню «Еще».</p>
<p>Кнопка «Создать» открывает новый документ выбранного вида.</p>
