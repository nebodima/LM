<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1024px;height:768px;background:#f4f6f9;font-family:"Segoe UI",Arial,sans-serif;color:#1f2d3d;display:flex;flex-direction:column;justify-content:center;padding:0 70px}
.tag{color:#6b7785;font-size:22px;letter-spacing:.5px}
h1{font-size:62px;line-height:1.1;color:#1f3a5f;margin:14px 0 22px}
.bar{width:260px;height:5px;background:#1f3a5f;border-radius:3px;margin-bottom:34px}
.row{display:flex;gap:22px}
.card{flex:1;background:#fff;border:2px solid #c9d3df;border-radius:14px;padding:22px 20px;text-align:center}
.ic{font-size:64px;line-height:1}
.t{font-size:22px;font-weight:700;margin-top:10px}
.s{font-size:17px;color:#34465a;margin-top:6px}
.g{border-color:#8cc59a;background:#eef8f0}.g .t{color:#2e7d45}
.r{border-color:#e5a3a3;background:#fcf0f0}.r .t{color:#b23b3b}
.b{border-color:#9db7d6;background:#edf3fa}.b .t{color:#1f3a5f}
</style></head><body>
<div class="tag">Детские центры, рок-школы, школы робототехники и программирования</div>
<h1>Платит бабушка,<br>учится внук</h1>
<div class="bar"></div>
<div class="row">
 <div class="card r"><div class="ic">👵</div><div class="t">Вычет?</div><div class="s">бабушки нет в перечне</div></div>
 <div class="card b"><div class="ic">📄</div><div class="t">Справка</div><div class="s">только плательщику</div></div>
 <div class="card g"><div class="ic">👩</div><div class="t">Платит мама</div><div class="s">и вычет не пропадает</div></div>
</div>
</body></html>
